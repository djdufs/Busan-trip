<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mobile preview (390×844)</title>
<style>
  html,body{margin:0;background:#11161f;display:flex;align-items:flex-start;justify-content:center;padding:0;font-family:-apple-system,sans-serif}
  .frame{width:390px;height:844px;border:0;overflow:hidden;background:#fff}
</style>
</head>
<body>
<iframe class="frame" src="https://djdufs.github.io/Busan-trip/?v=1130" title="모바일 미리보기"></iframe>
<script>
(function () {
  var f = document.querySelector('iframe');
  var p = new URLSearchParams(location.search);
  var to = p.get('to'), y = p.get('y'), off = parseInt(p.get('off') || '110', 10);
  function jump() {
    try {
      var w = f.contentWindow, d = f.contentDocument;
      if (to) {
        var el = d.getElementById(to);
        if (el) { w.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + w.scrollY - off)); }
      } else if (y) { w.scrollTo(0, +y); }
    } catch (e) {}
  }
  f.addEventListener('load', function () { setTimeout(jump, 1200); });
})();
</script>
</body>
</html>
